<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#ff5fd2"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}
    .mono{font-family:Consolas,'Cascadia Mono','Courier New',monospace}
    @keyframes fade{0%{opacity:0;letter-spacing:6px}100%{opacity:1;letter-spacing:.5px}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .q{animation:fade 2s ease-out both}
    .bar{transform-origin:500px 0;animation:grow 1.6s ease-out .4s both}
  </style>
  <rect width="1000" height="130" rx="12" fill="#0d0a1c" stroke="#3b2a6b"/>
  <text x="500" y="66" text-anchor="middle" class="serif q" font-size="26" font-style="italic" fill="#f5f3ff">“Every model starts as random weights.”</text>
  <rect class="bar" x="300" y="84" width="400" height="3" rx="1.5" fill="url(#g)"/>
  <text x="500" y="110" text-anchor="middle" class="mono" font-size="12" fill="#8b7fb8" letter-spacing="2">KEEP TRAINING · ONE COMMIT A DAY</text>
</svg>
